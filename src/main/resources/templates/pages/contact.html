<div th:fragment="content" class="page page-narrow">
    <div class="page-header">
        <div>
            <h1>Fale conosco</h1>
            <p class="page-description">Envie sua dúvida ou sugestão para a equipe do Veritas.</p>
        </div>
    </div>

    <div class="card">
        <form class="space-y-4">
            <div class="field">
                <label for="name" class="label">Nome</label>
                <input type="text" id="name" name="name" class="input" autocomplete="name">
            </div>
            <div class="field">
                <label for="email" class="label">E-mail</label>
                <input type="email" id="email" name="email" class="input" autocomplete="email">
            </div>
            <div class="field">
                <label for="message" class="label">Mensagem</label>
                <textarea id="message" name="message" rows="5" class="input"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Enviar mensagem</button>
            </div>
        </form>
    </div>
</div>
