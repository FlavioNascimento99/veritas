<div th:fragment="content" class="flex justify-center py-4">
    <section class="nb-card w-full max-w-2xl overflow-hidden" aria-labelledby="contact-title">
        <div class="bg-[var(--nb-green)] border-b-[3px] border-[var(--nb-ink)] px-6 py-3 flex items-center justify-between">
            <p class="font-mono-nb text-xs font-black uppercase tracking-[0.2em] text-black">■ Fale conosco</p>
            <span class="nb-tag bg-white text-black font-mono-nb">resposta em dias úteis</span>
        </div>
        <div class="p-6 sm:p-8">
            <h1 id="contact-title" class="text-3xl sm:text-4xl font-black uppercase tracking-tight">Entre em contato</h1>
            <p class="mt-1 font-medium opacity-80">Dúvidas sobre processos, acesso ou colegiados? Escreva para a equipe.</p>
            <form th:action="@{/contact}" method="post" class="mt-6 space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="name" class="nb-label">Nome</label>
                        <input type="text" id="name" name="name" required autocomplete="name" placeholder="Seu nome" class="nb-input">
                    </div>
                    <div>
                        <label for="email" class="nb-label">Email</label>
                        <input type="email" id="email" name="email" required autocomplete="email" placeholder="voce@ifpb.edu.br" class="nb-input">
                    </div>
                </div>
                <div>
                    <label for="message" class="nb-label">Mensagem</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Como podemos ajudar?" class="nb-textarea"></textarea>
                </div>
                <button type="submit" class="nb-btn bg-[var(--nb-ink)] !text-[var(--nb-paper)] w-full sm:w-auto">
                    Enviar mensagem <i class="fas fa-paper-plane" aria-hidden="true"></i>
                </button>
            </form>
        </div>
    </section>
</div>
