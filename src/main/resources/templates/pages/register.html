<div th:fragment="content" class="auth-page">
  <section class="auth-panel" aria-labelledby="register-title">
    <div class="mb-6 text-center">
      <span class="brand-mark mx-auto mb-4 h-10 w-10 rounded-[10px] text-base" aria-hidden="true"><i class="fas fa-book-open"></i></span>
      <h1 id="register-title">Criar conta</h1>
      <p class="mt-1 text-fg-secondary">Junte-se ao Veritas</p>
    </div>

    <div class="card">
      <form th:action="@{/register}" th:object="${registrationDTO}" method="POST" class="space-y-4">

        <div th:if="${#fields.hasErrors()}" class="alert alert-danger" role="alert">
          <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
          <div class="alert-body">
            <p class="alert-title">Corrija os erros abaixo:</p>
            <ul class="mt-1 list-inside list-disc">
              <li th:each="err : ${#fields.errors()}" th:text="${err}"></li>
            </ul>
          </div>
        </div>

        <div class="field">
          <label for="fullName" class="label">Nome completo</label>
          <input type="text" th:field="*{fullName}" id="fullName" required class="input"
                 th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                 th:attr="aria-invalid=${#fields.hasErrors('fullName')}, aria-describedby=${#fields.hasErrors('fullName')} ? 'fullName-error'"
                 placeholder="Seu nome completo"/>
          <p th:if="${#fields.hasErrors('fullName')}" id="fullName-error" th:errors="*{fullName}" class="field-error"></p>
        </div>

        <div class="field">
          <label for="email" class="label">E-mail</label>
          <input type="email" th:field="*{email}" id="email" required class="input"
                 th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                 th:attr="aria-invalid=${#fields.hasErrors('email')}, aria-describedby=${#fields.hasErrors('email')} ? 'email-error'"
                 placeholder="seu@email.com"/>
          <p th:if="${#fields.hasErrors('email')}" id="email-error" th:errors="*{email}" class="field-error"></p>
        </div>

        <div class="field">
          <label for="password" class="label">Senha</label>
          <input type="password" th:field="*{password}" id="password" required class="input"
                 th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                 th:attr="aria-invalid=${#fields.hasErrors('password')}, aria-describedby=${#fields.hasErrors('password')} ? 'password-error'"
                 placeholder="Mínimo 6 caracteres"/>
          <p th:if="${#fields.hasErrors('password')}" id="password-error" th:errors="*{password}" class="field-error"></p>
        </div>

        <div class="field">
          <label for="confirmPassword" class="label">Confirmar senha</label>
          <input type="password" th:field="*{confirmPassword}" id="confirmPassword" required class="input"
                 th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                 th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')}, aria-describedby=${#fields.hasErrors('confirmPassword')} ? 'confirmPassword-error'"
                 placeholder="Confirme sua senha"/>
          <p th:if="${#fields.hasErrors('confirmPassword')}" id="confirmPassword-error" th:errors="*{confirmPassword}" class="field-error"></p>
        </div>

        <div class="field">
          <label for="userType" class="label">Tipo de usuário</label>
          <select th:field="*{userType}" id="userType" required class="input"
                  th:classappend="${#fields.hasErrors('userType')} ? 'is-invalid' : ''"
                  th:attr="aria-invalid=${#fields.hasErrors('userType')}, aria-describedby=${#fields.hasErrors('userType')} ? 'userType-error'">
            <option value="">Selecione um tipo</option>
            <option value="student">Estudante</option>
            <option value="professor">Professor</option>
          </select>
          <p th:if="${#fields.hasErrors('userType')}" id="userType-error" th:errors="*{userType}" class="field-error"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block">Criar conta</button>
      </form>

      <div class="my-5 flex items-center gap-3 text-xs text-fg-secondary">
        <span class="h-px flex-1 bg-border"></span>
        Ou continue com
        <span class="h-px flex-1 bg-border"></span>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button type="button" class="btn btn-secondary">
          <i class="fab fa-google" aria-hidden="true"></i>Google
        </button>
        <button type="button" class="btn btn-secondary">
          <i class="fab fa-github" aria-hidden="true"></i>GitHub
        </button>
      </div>
    </div>

    <p class="mt-5 text-center text-fg-secondary">
      Já tem uma conta?
      <a th:href="@{/login}" class="link">Faça login</a>
    </p>
  </section>
</div>
