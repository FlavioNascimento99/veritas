<div th:fragment="content" class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <!-- Card Principal -->
    <div class="bg-white rounded-lg shadow-lg p-8">
      <!-- Header do Formulário -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Criar Conta</h1>
        <p class="text-gray-600">Junte-se à Veritas</p>
      </div>

      <!-- Formulário de Registro -->
      <form th:action="@{/register}" th:object="${registrationDTO}" method="POST" class="space-y-4">

        <div th:if="${#fields.hasErrors()}" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
          <p class="font-semibold">Corrija os erros abaixo:</p>
          <ul class="list-disc list-inside mt-1">
            <li th:each="err : ${#fields.errors()}" th:text="${err}"></li>
          </ul>
        </div>

        <!-- Nome Completo -->
        <div>
          <label for="fullName" class="block text-sm font-medium text-gray-700 mb-2">
            Nome Completo
          </label>
          <input type="text" th:field="*{fullName}" id="fullName" required
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                 th:classappend="${#fields.hasErrors('fullName')} ? 'border-red-500' : ''"
                 placeholder="Seu nome completo"/>
          <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            Email
          </label>
          <input type="email" th:field="*{email}" id="email" required
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                 th:classappend="${#fields.hasErrors('email')} ? 'border-red-500' : ''"
                 placeholder="seu@email.com"/>
          <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- Senha -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            Senha
          </label>
          <input type="password" th:field="*{password}" id="password" required
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                 th:classappend="${#fields.hasErrors('password')} ? 'border-red-500' : ''"
                 placeholder="Mínimo 6 caracteres"/>
          <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- Confirmar Senha -->
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
            Confirmar Senha
          </label>
          <input type="password" th:field="*{confirmPassword}" id="confirmPassword" required
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                 th:classappend="${#fields.hasErrors('confirmPassword')} ? 'border-red-500' : ''"
                 placeholder="Confirme sua senha"/>
          <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- Tipo de Usuário -->
        <div>
          <label for="userType" class="block text-sm font-medium text-gray-700 mb-2">
            Tipo de Usuário
          </label>
          <select th:field="*{userType}" id="userType" required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                  th:classappend="${#fields.hasErrors('userType')} ? 'border-red-500' : ''">
            <option value="">Selecione um tipo</option>
            <option value="student">Estudante</option>
            <option value="professor">Professor</option>
            <option value="admin">Administrador</option>
          </select>
          <p th:if="${#fields.hasErrors('userType')}" th:errors="*{userType}" class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- Botão de Registro -->
        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 mt-6"
        >
          Criar Conta
        </button>
      </form>

      <!-- Link para Login -->
      <div class="text-center mt-6">
        <p class="text-gray-600">
          Já tem uma conta?
          <a
            th:href="@{/login}"
            class="text-indigo-600 hover:text-indigo-700 font-medium transition"
          >
            Faça login
          </a>
        </p>
      </div>

      <!-- Divisor -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-300"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-white text-gray-500">Ou continue com</span>
        </div>
      </div>

      <!-- Botões Sociais -->
      <div class="grid grid-cols-2 gap-4">
        <button
          type="button"
          class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 px-4 rounded-lg transition flex items-center justify-center gap-2"
        >
          <i class="fab fa-google"></i> Google
        </button>
        <button
          type="button"
          class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 px-4 rounded-lg transition flex items-center justify-center gap-2"
        >
          <i class="fab fa-github"></i> GitHub
        </button>
      </div>
    </div>

    <!-- Botão para Voltar -->
    <div class="text-center mt-6">
      <a th:href="@{/login}"
         class="inline-flex items-center px-6 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 transition-colors">
        &larr; Voltar para o Login
      </a>
    </div>
  </div>
</div>
