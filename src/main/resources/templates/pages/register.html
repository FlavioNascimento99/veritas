<div th:fragment="content" class="flex justify-center py-6">
  <div class="w-full max-w-lg">
    <section class="nb-card overflow-hidden" aria-labelledby="register-title">
      <div class="bg-[var(--nb-pink)] border-b-[3px] border-[var(--nb-ink)] px-6 py-4 flex items-center justify-between">
        <p class="font-mono-nb text-xs font-black uppercase tracking-[0.2em] text-black">■ Nova conta</p>
        <span class="nb-tag bg-white text-black font-mono-nb">estudante · professor</span>
      </div>
      <div class="p-6 sm:p-8">
        <h1 id="register-title" class="text-3xl font-black uppercase tracking-tight">Criar conta</h1>
        <p class="mt-1 font-medium opacity-80">Junte-se ao Veritas em menos de 1 minuto.</p>

        <div th:if="${#fields.hasErrors()}" class="mt-5 border-[3px] border-black rounded-xl bg-[#FF6B6B] text-black px-4 py-3 font-bold shadow-[4px_4px_0_#111]" role="alert">
          <p class="font-black uppercase text-sm">Corrija os erros abaixo:</p>
          <ul class="list-disc list-inside mt-1 text-sm">
            <li th:each="err : ${#fields.errors()}" th:text="${err}"></li>
          </ul>
        </div>

        <form th:action="@{/register}" th:object="${registrationDTO}" method="POST" class="mt-6 space-y-5">
          <div>
            <label for="fullName" class="nb-label">Nome completo</label>
            <input type="text" th:field="*{fullName}" id="fullName" required placeholder="Seu nome completo"
                   class="nb-input" th:classappend="${#fields.hasErrors('fullName')} ? ' nb-input-error' : ''">
            <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="mt-1 text-sm font-bold text-[#B00020]"></p>
          </div>
          <div>
            <label for="email" class="nb-label">Email</label>
            <input type="email" th:field="*{email}" id="email" required placeholder="seu@email.com"
                   class="nb-input" th:classappend="${#fields.hasErrors('email')} ? ' nb-input-error' : ''">
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-sm font-bold text-[#B00020]"></p>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="password" class="nb-label">Senha</label>
              <input type="password" th:field="*{password}" id="password" required placeholder="Mínimo 6 caracteres"
                     class="nb-input" th:classappend="${#fields.hasErrors('password')} ? ' nb-input-error' : ''">
              <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 text-sm font-bold text-[#B00020]"></p>
            </div>
            <div>
              <label for="confirmPassword" class="nb-label">Confirmar senha</label>
              <input type="password" th:field="*{confirmPassword}" id="confirmPassword" required placeholder="Repita a senha"
                     class="nb-input" th:classappend="${#fields.hasErrors('confirmPassword')} ? ' nb-input-error' : ''">
              <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="mt-1 text-sm font-bold text-[#B00020]"></p>
            </div>
          </div>
          <div>
            <label for="userType" class="nb-label">Tipo de usuário</label>
            <select th:field="*{userType}" id="userType" required
                    class="nb-select" th:classappend="${#fields.hasErrors('userType')} ? ' nb-input-error' : ''">
              <option value="">Selecione um tipo</option>
              <option value="student">Estudante</option>
              <option value="professor">Professor</option>
            </select>
            <p th:if="${#fields.hasErrors('userType')}" th:errors="*{userType}" class="mt-1 text-sm font-bold text-[#B00020]"></p>
          </div>
          <button type="submit" class="nb-btn w-full bg-[var(--nb-ink)] !text-[var(--nb-paper)]">Criar conta</button>
        </form>

        <p class="mt-5 text-center font-medium text-sm">
          Já tem uma conta?
          <a th:href="@{/login}" class="font-black underline decoration-[3px] underline-offset-4 hover:bg-[var(--nb-yellow)] hover:text-black px-1">Faça login</a>
        </p>
      </div>
    </section>
    <div class="text-center mt-5">
      <a th:href="@{/login}" class="nb-btn nb-btn-sm bg-[var(--nb-card)]">&larr; Voltar para o login</a>
    </div>
  </div>
</div>
