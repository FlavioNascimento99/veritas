<div th:fragment="content" class="flex flex-col gap-6">
    <section class="nb-card overflow-hidden" aria-labelledby="collegiates-title">
        <div class="bg-[var(--nb-ink)] text-[var(--nb-paper)] px-6 py-4 flex flex-wrap items-center justify-between gap-3">
            <div>
                <p class="font-mono-nb text-[11px] font-bold uppercase tracking-[0.2em] opacity-70">■ Coordenação</p>
                <h1 id="collegiates-title" class="text-2xl sm:text-3xl font-black uppercase tracking-tight">Gerenciar Colegiados</h1>
                <p class="font-medium opacity-70 text-sm">Crie e gerencie os colegiados para suas reuniões</p>
            </div>
            <a th:href="@{/dashboard/collegiates/new}" class="nb-btn nb-btn-sm bg-[var(--nb-green)] text-black">
                <i class="fas fa-plus mr-2" aria-hidden="true"></i> Novo Colegiado
            </a>
        </div>
    </section>

    <div th:if="${successMessage}" role="status" class="border-[3px] border-[var(--nb-ink)] rounded-xl bg-[var(--nb-green)] text-black shadow-[4px_4px_0_#111] px-4 py-3 flex items-center gap-3 font-bold">
        <i class="fas fa-check-circle" aria-hidden="true"></i>
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" role="alert" class="border-[3px] border-[var(--nb-ink)] rounded-xl bg-[#FF6B6B] text-black shadow-[4px_4px_0_#111] px-4 py-3 flex items-center gap-3 font-bold">
        <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Tabela de Colegiados -->
    <section class="nb-card overflow-hidden" aria-labelledby="collegiates-list-title">
        <div class="border-b-[3px] border-[var(--nb-ink)] px-6 py-3 bg-[var(--nb-yellow)]">
            <h2 id="collegiates-list-title" class="text-lg font-black uppercase text-black">Colegiados cadastrados</h2>
        </div>
        <div class="p-4 sm:p-6">
            <div th:if="${collegiates.isEmpty()}" class="nb-card-flat p-8 text-center">
                <i class="fas fa-inbox text-4xl mb-4" aria-hidden="true"></i>
                <p class="text-lg font-black uppercase">Nenhum colegiado encontrado</p>
                <a th:href="@{/dashboard/collegiates/new}" class="mt-4 inline-block nb-btn nb-btn-sm bg-[var(--nb-ink)] !text-[var(--nb-paper)]">
                    Criar o primeiro colegiado
                </a>
            </div>

            <div th:unless="${collegiates.isEmpty()}">
                <div class="nb-table-wrap">
                    <table class="nb-table">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Descrição</th>
                                <th scope="col">Membros</th>
                                <th scope="col">Reuniões</th>
                                <th scope="col">Criado em</th>
                                <th scope="col"><span class="sr-only">Ações</span></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="collegiate : ${collegiates}">
                                <td class="font-mono-nb font-bold">
                                    <span th:text="${collegiate.id}"></span>
                                </td>
                                <td>
                                    <span th:text="${collegiate.description ?: 'Sem descrição'}"></span>
                                </td>
                                <td>
                                    <span th:if="${collegiate.collegiateMemberList == null or collegiate.collegiateMemberList.isEmpty()}" class="font-medium opacity-60 italic">Nenhum</span>
                                    <div th:if="${collegiate.collegiateMemberList != null and !collegiate.collegiateMemberList.isEmpty()}" class="flex flex-wrap gap-1">
                                        <span th:each="member : ${collegiate.collegiateMemberList.size() > 3 ? collegiate.collegiateMemberList.subList(0, 3) : collegiate.collegiateMemberList}"
                                              class="nb-tag bg-[var(--nb-cyan)] text-black">
                                            <span th:text="${member.name}"></span>
                                        </span>
                                        <span th:if="${collegiate.collegiateMemberList.size() > 3}" class="nb-tag bg-[var(--nb-card)]">
                                            +<span th:text="${collegiate.collegiateMemberList.size() - 3}"></span>
                                        </span>
                                    </div>
                                    <span class="ml-2 text-xs font-medium opacity-70">(<span th:text="${collegiate.collegiateMemberList != null ? collegiate.collegiateMemberList.size() : 0}"></span> total)</span>
                                </td>
                                <td>
                                    <span th:if="${collegiate.meetings == null or collegiate.meetings.isEmpty()}" class="font-medium opacity-60 italic">0 reuniões</span>
                                    <span th:unless="${collegiate.meetings == null or collegiate.meetings.isEmpty()}" class="nb-tag bg-[var(--nb-cyan)] text-black">
                                        <span th:text="${collegiate.meetings.size()} + ' reunião(ões)'"></span>
                                    </span>
                                </td>
                                <td class="font-mono-nb text-sm">
                                    <span th:if="${collegiate.createdAt != null}" th:text="${#temporals.format(collegiate.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                                </td>
                                <td class="text-center">
                                    <div class="flex justify-center gap-2">
                                        <a th:href="@{/dashboard/collegiates/{id}/edit(id=${collegiate.id})}"
                                           aria-label="Editar colegiado"
                                           class="nb-btn nb-btn-sm bg-[var(--nb-yellow)] text-black">
                                            <i class="fas fa-edit" aria-hidden="true"></i>
                                        </a>
                                        <form th:action="@{/dashboard/collegiates/{id}/delete(id=${collegiate.id})}"
                                              method="POST"
                                              class="inline"
                                              onsubmit="return confirm('Tem certeza que deseja deletar este colegiado?');">
                                            <button type="submit"
                                                    aria-label="Excluir colegiado"
                                                    class="nb-btn nb-btn-sm bg-[#FF6B6B] !text-black">
                                                <i class="fas fa-trash" aria-hidden="true"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</div>
