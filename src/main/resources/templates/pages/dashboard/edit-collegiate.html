<div th:fragment="content" class="flex flex-col gap-6">
    <section class="nb-card overflow-hidden" aria-labelledby="edit-collegiate-title">
        <div class="bg-[var(--nb-ink)] text-[var(--nb-paper)] px-6 py-4">
            <p class="font-mono-nb text-[11px] font-bold uppercase tracking-[0.2em] opacity-70">■ Coordenação</p>
            <h1 id="edit-collegiate-title" class="text-2xl sm:text-3xl font-black uppercase tracking-tight">Editar Colegiado</h1>
            <p class="font-medium opacity-70 text-sm" th:text="'ID: ' + ${collegiate.id}"></p>
        </div>
    </section>

    <!-- Aviso sobre número ímpar -->
    <div role="alert" class="border-[3px] border-[var(--nb-ink)] rounded-xl bg-[var(--nb-yellow)] text-black shadow-[4px_4px_0_#111] p-4">
        <p class="text-sm font-bold">
            <i class="fas fa-exclamation-triangle mr-2" aria-hidden="true"></i>
            <strong>Atenção:</strong> O colegiado deve ter um número ÍMPAR de membros. O sistema não permitirá salvar com número par.
        </p>
    </div>

    <!-- Formulário -->
    <section class="nb-card overflow-hidden" aria-labelledby="edit-collegiate-form-title">
        <div class="border-b-[3px] border-[var(--nb-ink)] px-6 py-3 bg-[var(--nb-yellow)]">
            <h2 id="edit-collegiate-form-title" class="text-lg font-black uppercase text-black">Dados do colegiado</h2>
        </div>
        <div class="p-6 sm:p-8">
            <form th:action="@{/dashboard/collegiates/{id}(id=${collegiate.id})}" method="POST" class="space-y-6">

                <!-- Descrição -->
                <div>
                    <label for="description" class="nb-label">
                        <i class="fas fa-file-alt mr-2" aria-hidden="true"></i> Descrição *
                    </label>
                    <textarea id="description"
                              name="description"
                              rows="3"
                              required
                              th:text="${collegiate.description}"
                              class="nb-textarea"></textarea>
                </div>

                <!-- Membros -->
                <div>
                    <label class="nb-label">
                        <i class="fas fa-users mr-2" aria-hidden="true"></i> Membros *
                        <span class="text-xs font-bold opacity-70 ml-2">(Número ÍMPAR para evitar empates)</span>
                    </label>
                    <div class="border-[3px] border-[var(--nb-ink)] rounded-xl bg-[var(--nb-card)] p-4 space-y-3 max-h-96 overflow-y-auto shadow-[4px_4px_0_#111]">
                        <div th:each="prof : ${professors}">
                            <label class="flex items-start space-x-3 p-3 rounded-xl cursor-pointer border-[3px] border-transparent">
                                <input type="checkbox"
                                       name="collegiateMemberList"
                                       th:value="${prof.id}"
                                       th:checked="${collegiate.collegiateMemberList != null and collegiate.collegiateMemberList.![id].contains(prof.id)}"
                                       class="mt-1 w-4 h-4">
                                <div class="flex-1">
                                    <p class="text-sm font-bold" th:text="${prof.name}"></p>
                                    <p class="text-xs font-medium opacity-70" th:text="${prof.login}"></p>
                                </div>
                                <span th:if="${prof.coordinator}" class="nb-badge bg-[#FF6B6B] text-black">
                                    Coordenador
                                </span>
                            </label>
                        </div>
                        <div th:if="${#lists.isEmpty(professors)}" class="text-center py-8 font-medium opacity-70">
                            <p>Nenhum professor disponível</p>
                        </div>
                    </div>
                    <p class="text-xs font-medium opacity-70 mt-2">
                        <i class="fas fa-info-circle mr-1" aria-hidden="true"></i> Membros selecionados: <span id="memberCount" class="font-black">0</span> (deve ser ÍMPAR)
                    </p>
                </div>

                <!-- Informações do Colegiado -->
                <div class="nb-card-flat p-4">
                    <h3 class="text-sm font-black uppercase mb-3">Informações do Colegiado</h3>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div>
                            <p class="font-medium opacity-70">Criado em:</p>
                            <p class="font-bold font-mono-nb" th:text="${#temporals.format(collegiate.createdAt, 'dd/MM/yyyy HH:mm')}"></p>
                        </div>
                        <div>
                            <p class="font-medium opacity-70">Reuniões associadas:</p>
                            <p class="font-black" th:text="${collegiate.meetings != null ? collegiate.meetings.size() : 0}"></p>
                        </div>
                    </div>
                </div>

                <!-- Botões -->
                <div class="flex justify-end gap-3 pt-6 border-t-[3px] border-[var(--nb-ink)]">
                    <a th:href="@{/dashboard/collegiates}" class="nb-btn bg-[var(--nb-card)]">
                        <i class="fas fa-times mr-2" aria-hidden="true"></i> Cancelar
                    </a>
                    <button type="submit" class="nb-btn bg-[var(--nb-ink)] !text-[var(--nb-paper)]">
                        <i class="fas fa-save" aria-hidden="true"></i> Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function updateMemberCount() {
                const checkboxes = document.querySelectorAll('input[name="collegiateMemberList"]:checked');
                const count = checkboxes.length;
                const countElement = document.getElementById('memberCount');
                countElement.textContent = count;

                if (count > 0 && count % 2 === 0) {
                    countElement.classList.add('text-red-600');
                    countElement.classList.remove('text-green-600');
                } else if (count > 0) {
                    countElement.classList.add('text-green-600');
                    countElement.classList.remove('text-red-600');
                } else {
                    countElement.classList.remove('text-red-600', 'text-green-600');
                }
            }

            const checkboxes = document.querySelectorAll('input[name="collegiateMemberList"]');
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', updateMemberCount);
            });

            updateMemberCount();
        });
    </script>
</div>
