<div th:fragment="content" class="page">
    <div class="page-header">
        <div>
            <h1>Professores do colegiado</h1>
            <p class="page-description">Consulte os professores cadastrados e seus contatos.</p>
        </div>
    </div>

    <div th:if="${professors != null and !professors.isEmpty()}" class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Login</th>
                <th scope="col">Matrícula</th>
                <th scope="col">Telefone</th>
                <th scope="col">Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="prof : ${professors}">
                <td>
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="font-medium" th:text="${prof.name}"></span>
                        <span th:if="${prof.coordinator}" class="badge badge-primary">Coordenador</span>
                    </div>
                </td>
                <td class="cell-muted" th:text="${prof.login}"></td>
                <td class="nowrap" th:text="${prof.register}"></td>
                <td class="nowrap cell-muted" th:text="${prof.phoneNumber}"></td>
                <td>
                    <span class="badge" th:classappend="${prof.isActive} ? 'badge-success' : 'badge-danger'"
                          th:text="${prof.isActive ? 'Ativo' : 'Inativo'}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${professors == null or professors.isEmpty()}" class="card empty-state">
        <i class="fas fa-user-slash empty-state-icon" aria-hidden="true"></i>
        <h2 class="text-base">Nenhum professor encontrado</h2>
        <p class="empty-state-text">Os professores cadastrados pelo administrador aparecem aqui.</p>
    </div>
</div>
