<div th:fragment="content" class="flex flex-col gap-6">
    <div class="w-full max-w-lg mx-auto flex flex-col gap-4">
        <div>
            <a th:href="@{/admin/collegiates}" class="nb-btn nb-btn-sm bg-[var(--nb-card)]"><i class="fas fa-arrow-left" aria-hidden="true"></i>Voltar</a>
        </div>
        <section class="nb-card overflow-hidden" aria-labelledby="new-collegiate-title">
            <div class="bg-[var(--nb-purple)] px-6 py-4 border-b-[3px] border-[var(--nb-ink)] text-center">
                <p class="font-mono-nb text-[11px] font-bold uppercase tracking-[0.2em] text-black opacity-70">■ Colegiado</p>
                <h1 id="new-collegiate-title" class="text-3xl font-black uppercase tracking-tight text-black">Cadastrar Novo Colegiado</h1>
                <p class="font-medium text-sm text-black">Preencha os dados abaixo para criar um novo colegiado.</p>
            </div>

            <form th:action="@{/admin/collegiates}" th:object="${collegiate}" method="POST" class="p-6 sm:p-8 flex flex-col gap-6">
                <div>
                    <label for="description" class="nb-label">Descrição do Colegiado</label>
                    <textarea th:field="*{description}" id="description" required
                           class="nb-textarea"
                           rows="3"
                           placeholder="Descreva o propósito e função deste colegiado"></textarea>
                </div>

                <div>
                    <label for="rapporteurId" class="nb-label">Relator (Professor)</label>
                    <select th:field="*{rapporteurId}" id="rapporteurId" required class="nb-select">
                        <option value="">Selecione um professor</option>
                        <option th:each="professor : ${professors}" th:value="${professor.id}" th:text="${professor.name}"></option>
                    </select>
                </div>

                <div>
                    <label for="memberIds" class="nb-label">Membros do Colegiado</label>
                    <select th:field="*{memberIds}" id="memberIds" multiple required class="nb-select" size="5">
                        <option th:each="professor : ${professors}" th:value="${professor.id}" th:text="${professor.name}"></option>
                    </select>
                    <p class="text-xs font-bold mt-2 opacity-70">Use Ctrl+Click (ou Cmd+Click no Mac) para selecionar múltiplos membros</p>
                </div>

                <div class="flex items-center justify-between pt-4 border-t-[3px] border-[var(--nb-ink)]">
                    <a th:href="@{/dashboard}" class="font-black underline decoration-[3px] underline-offset-4">Cancelar</a>
                    <button type="submit" class="nb-btn nb-btn-sm bg-[var(--nb-ink)] !text-[var(--nb-paper)]">Cadastrar Colegiado</button>
                </div>
            </form>
        </section>
    </div>
</div>
