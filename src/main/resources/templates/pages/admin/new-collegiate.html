<div th:fragment="content" class="page page-narrow">
    <a th:href="@{/admin/collegiates}" class="back-link">
        <i class="fas fa-arrow-left" aria-hidden="true"></i>Voltar
    </a>

    <div class="page-header">
        <div>
            <h1>Cadastrar novo colegiado</h1>
            <p class="page-description">Preencha os dados abaixo para criar um novo colegiado.</p>
        </div>
    </div>

    <div th:replace="~{fragments/flash :: messages}"></div>

    <div class="card">
        <form th:action="@{/admin/collegiates}" th:object="${collegiate}" method="POST" class="space-y-4">
            <div class="field">
                <label for="description" class="label">Descrição do colegiado</label>
                <textarea th:field="*{description}" id="description" required class="input" rows="3"
                          placeholder="Descreva o propósito e função deste colegiado"></textarea>
            </div>

            <div class="field">
                <label for="rapporteurId" class="label">Relator (professor)</label>
                <select th:field="*{rapporteurId}" id="rapporteurId" required class="input">
                    <option value="">Selecione um professor</option>
                    <option th:each="professor : ${professors}" th:value="${professor.id}" th:text="${professor.name}"></option>
                </select>
            </div>

            <div class="field">
                <label for="memberIds" class="label">Membros do colegiado</label>
                <select th:field="*{memberIds}" id="memberIds" multiple required class="input" size="5"
                        aria-describedby="memberIdsHelp">
                    <option th:each="professor : ${professors}" th:value="${professor.id}" th:text="${professor.name}"></option>
                </select>
                <p id="memberIdsHelp" class="help">Use Ctrl+Click (ou Cmd+Click no Mac) para selecionar múltiplos membros.</p>
            </div>

            <div class="form-actions form-actions-bordered">
                <button type="submit" class="btn btn-primary">Cadastrar colegiado</button>
                <a th:href="@{/dashboard}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
