<div th:fragment="content" class="page">
    <div class="page-header">
        <div>
            <h1>Gerenciar processos</h1>
            <p class="page-description">Lista de todos os processos do sistema.</p>
        </div>
        <div class="page-actions">
            <a th:href="@{/dashboard}" class="btn btn-secondary">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>Retornar ao dashboard
            </a>
        </div>
    </div>

    <div th:replace="~{fragments/flash :: messages}"></div>

    <div class="section-stack">
        <section aria-labelledby="process-stats-title">
            <h2 id="process-stats-title" class="sr-only">Resumo</h2>
            <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
                <div class="stat">
                    <span class="stat-label">Total de processos</span>
                    <span class="stat-value" th:text="${totalProcesses}"></span>
                </div>
                <div class="stat">
                    <span class="stat-label">Em espera</span>
                    <span class="stat-value" th:text="${waitingProcesses}"></span>
                </div>
                <div class="stat">
                    <span class="stat-label">Aprovados</span>
                    <span class="stat-value" th:text="${approvedProcesses}"></span>
                </div>
                <div class="stat">
                    <span class="stat-label">Rejeitados</span>
                    <span class="stat-value" th:text="${rejectedProcesses}"></span>
                </div>
            </div>
        </section>

        <section aria-labelledby="process-list-title">
            <h2 id="process-list-title" class="sr-only">Processos</h2>

            <div th:if="${processes.isEmpty()}" class="card empty-state">
                <i class="fas fa-folder-open empty-state-icon" aria-hidden="true"></i>
                <h3>Nenhum processo encontrado</h3>
                <p class="empty-state-text">Os processos criados pelos estudantes aparecem aqui.</p>
            </div>

            <div th:unless="${processes.isEmpty()}" class="table-wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Número</th>
                            <th scope="col">Título</th>
                            <th scope="col">Criador</th>
                            <th scope="col">Status</th>
                            <th scope="col">Data de criação</th>
                            <th scope="col" class="text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="process : ${processes}">
                            <td class="cell-strong tabular-nums" th:text="${process.id}"></td>
                            <td class="min-w-48" th:text="${process.title}"></td>
                            <td class="cell-muted" th:text="${process.processCreator.name}"></td>
                            <td><span th:replace="~{fragments/status-badges :: process(${process.status})}"></span></td>
                            <td class="nowrap cell-muted" th:text="${#temporals.format(process.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="cell-actions">
                                <a th:href="@{/processes/{id}(id=${process.id})}" class="btn btn-ghost btn-sm">
                                    <i class="fas fa-eye" aria-hidden="true"></i>Visualizar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>
