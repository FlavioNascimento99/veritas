<div th:fragment="content" class="page page-narrow">
    <a th:href="@{/admin/students}" class="back-link">
        <i class="fas fa-arrow-left" aria-hidden="true"></i>Voltar
    </a>

    <div class="page-header">
        <div>
            <h1>Cadastrar novo estudante</h1>
            <p class="page-description">Preencha os dados abaixo para criar uma nova conta de estudante.</p>
        </div>
    </div>

    <div th:replace="~{fragments/flash :: messages}"></div>

    <div class="card">
        <form th:action="@{/admin/students}" th:object="${student}" method="POST" class="space-y-4">
            <div th:if="${#fields.hasErrors()}" class="alert alert-danger" role="alert">
                <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
                <div class="alert-body">
                    <p class="alert-title">Corrija os erros abaixo:</p>
                    <ul class="mt-1 list-inside list-disc">
                        <li th:each="err : ${#fields.errors()}" th:text="${err}"></li>
                    </ul>
                </div>
            </div>

            <div class="field">
                <label for="name" class="label">Nome completo</label>
                <input type="text" th:field="*{name}" id="name" required class="input"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                       th:attr="aria-invalid=${#fields.hasErrors('name')}, aria-describedby=${#fields.hasErrors('name')} ? 'name-error'"/>
                <p th:if="${#fields.hasErrors('name')}" id="name-error" th:errors="*{name}" class="field-error"></p>
            </div>

            <div class="field">
                <label for="login" class="label">E-mail (login)</label>
                <input type="email" th:field="*{login}" id="login" required class="input" autocomplete="off"
                       th:classappend="${#fields.hasErrors('login')} ? 'is-invalid' : ''"
                       th:attr="aria-invalid=${#fields.hasErrors('login')}, aria-describedby=${#fields.hasErrors('login')} ? 'login-error'"/>
                <p th:if="${#fields.hasErrors('login')}" id="login-error" th:errors="*{login}" class="field-error"></p>
            </div>

            <div class="alert alert-info">
                <i class="fas fa-circle-info" aria-hidden="true"></i>
                <p class="alert-body"><strong>Matrícula:</strong> será gerada automaticamente pelo sistema.</p>
            </div>

            <div class="field">
                <label for="password" class="label">Senha provisória</label>
                <input type="password" th:field="*{password}" id="password" required class="input" autocomplete="new-password"
                       placeholder="Mínimo 6 caracteres"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                       th:attr="aria-invalid=${#fields.hasErrors('password')}, aria-describedby=${#fields.hasErrors('password')} ? 'password-error'"/>
                <p th:if="${#fields.hasErrors('password')}" id="password-error" th:errors="*{password}" class="field-error"></p>
            </div>

            <div class="form-actions form-actions-bordered">
                <button type="submit" class="btn btn-primary">Cadastrar estudante</button>
                <a th:href="@{/dashboard}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
