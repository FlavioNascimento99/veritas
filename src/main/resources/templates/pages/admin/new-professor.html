<div th:fragment="content" class="flex flex-col gap-6">
    <div class="w-full max-w-lg mx-auto flex flex-col gap-4">
        <div>
            <a th:href="@{/admin/professors}" class="nb-btn nb-btn-sm bg-[var(--nb-card)]"><i class="fas fa-arrow-left" aria-hidden="true"></i>Voltar</a>
        </div>
        <section class="nb-card overflow-hidden" aria-labelledby="new-professor-title">
            <div class="bg-[var(--nb-green)] px-6 py-4 border-b-[3px] border-[var(--nb-ink)] text-center">
                <p class="font-mono-nb text-[11px] font-bold uppercase tracking-[0.2em] text-black opacity-70">■ Professor</p>
                <h1 id="new-professor-title" class="text-3xl font-black uppercase tracking-tight text-black">Cadastrar Novo Professor</h1>
                <p class="font-medium text-sm text-black">Preencha os dados abaixo para criar uma nova conta de professor.</p>
            </div>

            <form th:action="@{/admin/professors}" th:object="${professor}" method="POST" class="p-6 sm:p-8 flex flex-col gap-6">
                <div th:if="${#fields.hasErrors()}" role="alert" class="px-4 py-3 font-bold border-[3px] border-[var(--nb-ink)] bg-[#FF6B6B] text-black shadow-[4px_4px_0_var(--nb-ink)]">
                    <p class="font-black uppercase">Corrija os erros abaixo:</p>
                    <ul class="list-disc list-inside mt-1">
                        <li th:each="err : ${#fields.errors()}" th:text="${err}"></li>
                    </ul>
                </div>

                <div>
                    <label for="name" class="nb-label">Nome Completo</label>
                    <input type="text" th:field="*{name}" id="name" required class="nb-input"
                           th:classappend="${#fields.hasErrors('name')} ? ' nb-input-error' : ''"/>
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-[#B00020] font-bold text-sm mt-1"></p>
                </div>

                <div>
                    <label for="phoneNumber" class="nb-label">Número para contato</label>
                    <input type="text" th:field="*{phoneNumber}" id="phoneNumber" required class="nb-input"/>
                </div>

                <div class="px-4 py-3 font-bold border-[3px] border-[var(--nb-ink)] bg-[var(--nb-cyan)] text-black shadow-[4px_4px_0_var(--nb-ink)]">
                    <p class="text-sm"><strong>Matrícula:</strong> Será gerada automaticamente pelo sistema.</p>
                </div>

                <div>
                    <label for="login" class="nb-label">Email (Login)</label>
                    <input type="email" th:field="*{login}" id="login" required class="nb-input"
                           th:classappend="${#fields.hasErrors('login')} ? ' nb-input-error' : ''"/>
                    <p th:if="${#fields.hasErrors('login')}" th:errors="*{login}" class="text-[#B00020] font-bold text-sm mt-1"></p>
                </div>

                <div>
                    <label for="password" class="nb-label">Senha Provisória</label>
                    <input type="password" th:field="*{password}" id="password" required class="nb-input"
                           placeholder="Mínimo 6 caracteres"
                           th:classappend="${#fields.hasErrors('password')} ? ' nb-input-error' : ''"/>
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-[#B00020] font-bold text-sm mt-1"></p>
                </div>

                <div class="nb-card-flat p-4 flex items-center gap-3">
                    <input type="checkbox" th:field="*{coordinator}" id="coordinator" class="h-5 w-5 accent-black"/>
                    <label for="coordinator" class="block text-sm font-black uppercase">Marcar como Coordenador</label>
                </div>

                <div class="flex items-center justify-between pt-4 border-t-[3px] border-[var(--nb-ink)]">
                    <a th:href="@{/dashboard}" class="font-black underline decoration-[3px] underline-offset-4">Cancelar</a>
                    <button type="submit" class="nb-btn nb-btn-sm bg-[var(--nb-ink)] !text-[var(--nb-paper)]">Cadastrar Professor</button>
                </div>
            </form>
        </section>
    </div>
</div>
