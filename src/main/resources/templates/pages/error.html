<div th:fragment="content" class="auth-page">
    <div class="card auth-panel text-center">
        <div class="empty-state">
            <i class="fas fa-triangle-exclamation empty-state-icon text-danger" aria-hidden="true"></i>
            <h1 class="text-xl">Erro</h1>
            <p class="empty-state-text" th:text="${errorMessage != null ? errorMessage : 'Algo deu errado. Tente novamente.'}"></p>
            <div class="empty-state-actions">
                <a th:href="@{/dashboard}" class="btn btn-primary">
                    <i class="fas fa-arrow-left" aria-hidden="true"></i>Voltar ao dashboard
                </a>
            </div>
        </div>
    </div>
</div>
