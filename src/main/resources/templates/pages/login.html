<div th:fragment="content" class="auth-page">
    <section class="auth-panel" aria-labelledby="login-title">
        <div class="mb-6 text-center">
            <span class="brand-mark mx-auto mb-4 h-10 w-10 rounded-[10px] text-base" aria-hidden="true"><i class="fas fa-book-open"></i></span>
            <h1 id="login-title">Bem-vindo de volta</h1>
            <p class="mt-1 text-fg-secondary">Faça login para acessar o Veritas.</p>
        </div>

        <div class="card">
            <div th:if="${param.error}" class="alert alert-danger mb-4" role="alert">
                <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
                <div class="alert-body">
                    <p class="alert-title">Não foi possível entrar</p>
                    <p>Usuário ou senha inválidos.</p>
                </div>
            </div>

            <form th:action="@{/login}" method="post" class="space-y-4">
                <div class="field">
                    <label for="username" class="label">E-mail</label>
                    <input id="username" name="username" type="text" autocomplete="email" required class="input">
                </div>

                <div class="field">
                    <label for="password" class="label">Senha</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required class="input">
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block">Entrar</button>
            </form>
        </div>
    </section>
</div>
