<div th:fragment="content" class="flex justify-center py-6">
    <section class="nb-card w-full max-w-md overflow-hidden" aria-labelledby="login-title">
        <div class="bg-[var(--nb-ink)] text-[var(--nb-paper)] px-6 py-4 flex items-center justify-between">
            <p class="font-mono-nb text-xs font-bold uppercase tracking-[0.2em]">■ Acesso restrito</p>
            <span class="nb-tag bg-[var(--nb-yellow)] !text-black font-mono-nb">login</span>
        </div>
        <div class="p-6 sm:p-8">
            <h1 id="login-title" class="text-3xl font-black uppercase tracking-tight">Bem-vindo de volta!</h1>
            <p class="mt-1 font-medium opacity-80">Faça login para acessar o Veritas.</p>

            <div th:if="${param.error}" class="mt-5 border-[3px] border-black rounded-xl bg-[#FF6B6B] text-black px-4 py-3 font-bold shadow-[4px_4px_0_#111]" role="alert">
                <strong class="font-black uppercase text-sm">Erro!</strong>
                <span class="block text-sm">Usuário ou senha inválidos.</span>
            </div>
            <div th:if="${param.logout}" class="mt-5 border-[3px] border-black rounded-xl bg-[var(--nb-green)] text-black px-4 py-3 font-bold shadow-[4px_4px_0_#111]" role="status">
                <span class="block text-sm font-bold">Você saiu com segurança. Até logo!</span>
            </div>

            <form th:action="@{/login}" method="post" class="mt-6 space-y-5">
                <div>
                    <label for="username" class="nb-label">Email</label>
                    <input id="username" name="username" type="email" autocomplete="email" required placeholder="voce@ifpb.edu.br" class="nb-input">
                </div>
                <div>
                    <label for="password" class="nb-label">Senha</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" class="nb-input">
                </div>
                <button type="submit" class="nb-btn w-full bg-[var(--nb-yellow)] text-black">
                    Entrar <i class="fas fa-arrow-right" aria-hidden="true"></i>
                </button>
            </form>

            <div class="mt-6 flex items-center gap-3" aria-hidden="true">
                <span class="h-[3px] flex-1 bg-[var(--nb-ink)]"></span>
                <span class="font-mono-nb text-xs font-bold uppercase">ou</span>
                <span class="h-[3px] flex-1 bg-[var(--nb-ink)]"></span>
            </div>
            <p class="mt-4 text-center font-medium text-sm">
                Sem conta?
                <a th:href="@{/register}" class="font-black underline decoration-[3px] underline-offset-4 hover:bg-[var(--nb-yellow)] hover:text-black px-1">Crie a sua</a>
            </p>
        </div>
    </section>
</div>
