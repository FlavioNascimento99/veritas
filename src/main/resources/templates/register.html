<div th:fragment="content" class="flex justify-center py-6">
  <div class="w-full max-w-md">
    <section class="nb-card overflow-hidden" aria-labelledby="admin-register-title">
      <div class="bg-[var(--nb-ink)] text-[var(--nb-paper)] px-6 py-4">
        <p class="font-mono-nb text-xs font-bold uppercase tracking-[0.2em]">■ Cadastro administrativo</p>
      </div>
      <div class="p-6 sm:p-8">
        <h1 id="admin-register-title" class="text-3xl font-black uppercase tracking-tight">Cadastro administrativo</h1>
        <form th:action="@{/register}" method="POST" class="mt-6 space-y-5">
          <div>
            <label for="fullName" class="nb-label">Nome completo</label>
            <input type="text" id="fullName" name="fullName" required placeholder="Seu nome completo" class="nb-input">
          </div>
          <div>
            <label for="registerId" class="nb-label">Registro</label>
            <input type="text" id="registerId" name="register" required placeholder="Matrícula / SIAPE" class="nb-input">
          </div>
          <div>
            <label for="email" class="nb-label">Login (email)</label>
            <input type="email" id="email" name="email" required placeholder="seu@email.com" class="nb-input">
          </div>
          <div>
            <label for="password" class="nb-label">Senha</label>
            <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres" class="nb-input">
          </div>
          <div>
            <label for="confirmPassword" class="nb-label">Confirmar senha</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirme sua senha" class="nb-input">
          </div>
          <div>
            <label for="userType" class="nb-label">Tipo de usuário</label>
            <select id="userType" name="userType" required class="nb-select">
              <option value="admin">Administrador</option>
            </select>
          </div>
          <button type="submit" class="nb-btn w-full bg-[var(--nb-ink)] !text-[var(--nb-paper)]">Criar conta</button>
        </form>
      </div>
    </section>
  </div>
</div>
