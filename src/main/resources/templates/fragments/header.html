<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="border-b-[3px] border-[var(--nb-ink)] bg-[var(--nb-card)] sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-4">
        <a th:href="@{/}" class="flex items-center gap-3 shrink-0" aria-label="Veritas — início">
            <span class="w-11 h-11 inline-flex items-center justify-center bg-[var(--nb-ink)] text-[var(--nb-yellow)] border-[3px] border-[var(--nb-ink)] rounded-xl shadow-[3px_3px_0_var(--nb-ink)]" aria-hidden="true">
                <i class="fas fa-book-open text-xl"></i>
            </span>
            <span class="leading-none">
                <span class="block text-2xl font-black tracking-tight uppercase">Veritas</span>
                <span class="block text-[11px] font-bold uppercase tracking-[0.18em] opacity-70">Processos acadêmicos</span>
            </span>
        </a>

        <div class="flex items-center gap-3">
            <div sec:authorize="isAuthenticated()" class="hidden sm:flex items-center gap-3">
                <div class="text-right leading-tight">
                    <p class="text-sm font-extrabold" sec:authentication="name">usuário</p>
                    <p class="mt-1">
                        <span sec:authorize="hasRole('ADMIN')" class="nb-badge bg-[var(--nb-yellow)]"><i class="fas fa-crown text-[10px]"></i>Admin</span>
                        <span sec:authorize="hasRole('COORDINATOR')" class="nb-badge bg-[var(--nb-pink)]"><i class="fas fa-briefcase text-[10px]"></i>Coordenação</span>
                        <span sec:authorize="hasRole('PROFESSOR')" class="nb-badge bg-[var(--nb-cyan)]"><i class="fas fa-chalkboard text-[10px]"></i>Professor</span>
                        <span sec:authorize="hasRole('STUDENT')" class="nb-badge bg-[var(--nb-green)]"><i class="fas fa-graduation-cap text-[10px]"></i>Estudante</span>
                    </p>
                </div>
                <span class="w-10 h-10 inline-flex items-center justify-center rounded-full border-[3px] border-[var(--nb-ink)] bg-[var(--nb-purple)] text-black font-black" aria-hidden="true">
                    <i class="fas fa-user"></i>
                </span>
            </div>

            <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="nb-btn nb-btn-sm bg-[var(--nb-yellow)] text-black">
                <i class="fa-solid fa-door-open" aria-hidden="true"></i>Entrar
            </a>

            <details sec:authorize="isAuthenticated()" class="nb-details relative">
                <summary class="nb-btn nb-btn-sm bg-[var(--nb-card)]" aria-label="Abrir menu da conta" aria-haspopup="menu">
                    <i class="fas fa-chevron-down" aria-hidden="true"></i>
                    <span class="hidden md:inline font-extrabold text-xs uppercase">Conta</span>
                </summary>
                <div role="menu" class="absolute right-0 mt-2 w-52 nb-card p-2 z-50">
                    <a th:href="@{/dashboard}" role="menuitem" class="flex items-center gap-2 px-3 py-2 rounded-lg font-bold text-sm border-2 border-transparent hover:border-[var(--nb-ink)] hover:bg-[var(--nb-yellow)] hover:text-black">
                        <i class="fas fa-tachometer-alt" aria-hidden="true"></i>Dashboard
                    </a>
                    <form th:action="@{/logout}" method="post" class="mt-1">
                        <button type="submit" role="menuitem" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg font-bold text-sm border-2 border-transparent hover:border-[var(--nb-ink)] hover:bg-[#FF6B6B] hover:text-black">
                            <i class="fas fa-sign-out-alt" aria-hidden="true"></i>Sair
                        </button>
                    </form>
                </div>
            </details>
        </div>
    </div>
</header>
</body>
</html>
