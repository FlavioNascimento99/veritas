# ============================================================
# PRODUCTION PROFILE - Supabase (Cloud)
# ============================================================
# This profile is used for production deployment.
# PostgreSQL is hosted on Supabase (managed database).
# All credentials must be provided via environment variables.
# ============================================================

spring:
  application:
    name: veritas

  # ===============================
  # = DATABASE CONFIGURATION (SUPABASE)
  # ===============================
  datasource:
    # Supabase PostgreSQL connection
    # Direto:    PGHOST=db.<ref>.supabase.co PGPORT=5432 PGUSER=postgres
    # Pooler (recomendado p/ serverless/Cloudflare, IPv4): PGHOST=aws-0-<region>.pooler.supabase.com PGPORT=6543 PGUSER=postgres.<ref>
    # prepareThreshold=0 desliga prepared statements no lado do servidor (exigido pelo pooler em modo transaction, inofensivo no direto)
    url: jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE:postgres}?sslmode=require&prepareThreshold=0
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

    # Connection Pool Settings
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Não derruba a JVM de imediato se o banco oscilar no cold start;
      # aguarda até 60s por uma conexão antes de falhar o boot.
      initialization-fail-timeout: 60000
      connection-test-query: SELECT 1

  # ===============================
  # = JPA / HIBERNATE
  # ===============================
  jpa:
    # validate: Do NOT alter the schema in production
    # update: Use only if you know what you're doing
    # none: No schema updates
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ===============================
  # = SQL INITIALIZATION (PROD)
  # ===============================
  sql:
    init:
      mode: never
      # Production never runs automatic SQL scripts

# ===============================
# = SERVER CONFIG
# ===============================
server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  # Shutdown gracefully
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10

# ===============================
# = ACTUATOR (para health check do container)
# ===============================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# ===============================
# = LOGGING (PROD)
# ===============================
logging:
  level:
    root: WARN
    br.edu.ifpb.veritas: INFO
    org.springframework.web: WARN
    org.springframework.security: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger - %msg%n"
